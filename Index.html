<!DOCTYPE html>
<html>
<head>
<title>Om Provisional Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
 margin:0;
 font-family:sans-serif;
 background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
 url("https://images.unsplash.com/photo-1604719312566-8912e6c5c1a1");
 background-size:cover;
 background-position:center;
 background-attachment:fixed;
 padding-bottom:80px;
}

/* HEADER */
header{
 background:rgba(40,116,240,0.95);
 color:white;
 padding:14px;
 text-align:center;
 font-size:20px;
 font-weight:bold;
}

/* SEARCH */
.search{
 text-align:center;
 padding:10px;
}

.search input{
 width:90%;
 padding:10px;
 border:none;
 border-radius:10px;
 outline:none;
}

/* PRODUCTS */
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:12px;
 padding:10px;
}

/* CARD */
.card{
 background:rgba(255,255,255,0.9);
 border-radius:15px;
 padding:10px;
 text-align:center;
 box-shadow:0 8px 20px rgba(0,0,0,0.3);
 transition:0.3s;
}

.card:hover{
 transform:scale(1.05);
}

.card img{
 width:100%;
 height:110px;
 object-fit:cover;
 border-radius:10px;
}

/* BUTTON */
button{
 background:linear-gradient(45deg,#ff9f00,#ff6a00);
 color:white;
 border:none;
 padding:8px;
 width:100%;
 margin-top:5px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{
 background:gray;
}

/* FLOAT CART BUTTON */
#cartBtn{
 position:fixed;
 bottom:20px;
 right:20px;
 background:#ff9f00;
 color:white;
 border:none;
 padding:12px 16px;
 border-radius:50px;
 font-weight:bold;
 z-index:10000;
}

/* SLIDE CART PANEL */
#cartPanel{
 position:fixed;
 bottom:-500px;
 left:0;
 width:100%;
 background:white;
 border-radius:20px 20px 0 0;
 padding:15px;
 box-shadow:0 -5px 20px rgba(0,0,0,0.3);
 transition:0.4s;
 z-index:9999;
}

#cartPanel.active{
 bottom:0;
}
</style>

</head>

<body>

<header>🛒 Om Provisional Store</header>

<div class="search">
<input type="text" id="search" placeholder="Search products..." onkeyup="searchProduct()">
</div>

<div id="products" class="products"></div>

<!-- CART BUTTON -->
<button id="cartBtn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>

<!-- SLIDE CART -->
<div id="cartPanel">
<h3>🛒 Your Cart</h3>
<p>Total: ₹<span id="total">0</span></p>

<button onclick="order()">Order Now</button>
<button onclick="payNow()">Pay Now</button>
<button onclick="closeCart()">Close</button>
</div>

<script>

let cart=[];
let total=0;

/* PRODUCTS */
let products=[
{name:"Rice",price:60,stock:true,img:"https://source.unsplash.com/300x300/?rice"},
{name:"Wheat Flour",price:50,stock:true,img:"https://source.unsplash.com/300x300/?flour"},
{name:"Sugar",price:45,stock:true,img:"https://source.unsplash.com/300x300/?sugar"},
{name:"Salt",price:20,stock:true,img:"https://source.unsplash.com/300x300/?salt"},

{name:"Toor Dal",price:120,stock:true,img:"https://source.unsplash.com/300x300/?dal"},
{name:"Moong Dal",price:110,stock:false,img:"https://source.unsplash.com/300x300/?lentils"},

{name:"Kurkure",price:20,stock:true,img:"https://source.unsplash.com/300x300/?chips"},
{name:"Lays Chips",price:20,stock:true,img:"https://source.unsplash.com/300x300/?chips"},

{name:"Soap",price:35,stock:true,img:"https://source.unsplash.com/300x300/?soap"},
{name:"Shampoo",price:120,stock:false,img:"https://source.unsplash.com/300x300/?shampoo"},

{name:"Toy Car",price:150,stock:true,img:"https://source.unsplash.com/300x300/?toy"}
];

/* DISPLAY */
function display(list){
 let html="";

 list.forEach(p=>{
 html+=`
 <div class="card">
   <img src="${p.img}">
   <h4>${p.name}</h4>
   <p>₹${p.price}</p>

   ${p.stock
   ? `<span style="color:green;font-weight:bold;">🟢 In Stock</span>
      <button onclick="add('${p.name}',${p.price})">Add</button>`
   : `<span style="color:red;font-weight:bold;">🔴 Out of Stock</span>
      <button disabled>Not Available</button>`
   }

 </div>`;
 });

 document.getElementById("products").innerHTML=html;
}
display(products);

/* SEARCH */
function searchProduct(){
 let val=document.getElementById("search").value.toLowerCase();
 let filtered=products.filter(p=>p.name.toLowerCase().includes(val));
 display(filtered);
}

/* ADD CART */
function add(n,p){
 cart.push(n);
 total+=p;
 document.getElementById("count").innerText=cart.length;
 document.getElementById("total").innerText=total;
}

/* PAYMENT */
function payNow(){
 window.location.href="upi://pay?pa=9105012459@ybl&pn=OmStore&am="+total+"&cu=INR";
}

/* ORDER */
function order(){
 let name=prompt("Enter your name:");
 let phone=prompt("Enter your phone:");
 let address=prompt("Enter your address:");

 if(!name||!phone||!address){
  alert("Fill all details!");
  return;
 }

 let msg=
 "🛒 Order\n\n"+
 "Name: "+name+"\n"+
 "Phone: "+phone+"\n"+
 "Address: "+address+"\n\n"+
 "Items: "+cart.join(", ")+"\n"+
 "Total: ₹"+total;

 window.open("https://wa.me/919105012459?text="+encodeURIComponent(msg));
}

/* CART CONTROLS */
function openCart(){
 document.getElementById("cartPanel").classList.add("active");
}

function closeCart(){
 document.getElementById("cartPanel").classList.remove("active");
}

</script>

</body>
</html>
