<!DOCTYPE html>
<html>
<head>
<title>Om Provisional Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {font-family: Arial; margin:0; background:#f1f3f6;}
header {background:#2874f0; color:white; padding:15px; text-align:center;}

.nav {background:#fff; padding:10px; text-align:center;}
.nav button {margin:5px; padding:8px; border:none; cursor:pointer;}

.products {
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;
 padding:15px;
}

.card {
 background:white;
 padding:10px;
 border-radius:10px;
 text-align:center;
 box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img {
 width:100%;
 height:120px;
 object-fit:cover;
}

button {
 background:#ff9f00;
 color:white;
 padding:6px;
 border:none;
 cursor:pointer;
 margin-top:5px;
}

#cart {
 position:fixed;
 bottom:10px;
 right:10px;
 background:white;
 padding:10px;
 border-radius:10px;
 box-shadow:0 2px 5px rgba(0,0,0,0.3);
}
</style>

</head>

<body>

<header>
<h2>🛒 Om Provisional Store</h2>
<p>Daily Needs | Grocery | Toys</p>
</header>

<div class="nav">
<button onclick="filter('all')">All</button>
<button onclick="filter('grocery')">Grocery</button>
<button onclick="filter('toys')">Toys</button>
</div>

<div id="products" class="products"></div>

<div id="cart">
🛒 <span id="count">0</span> Items  
<br>₹ <span id="total">0</span>
<br>
<button onclick="payNow()">Pay Now</button>
<button onclick="whatsappOrder()">WhatsApp</button>
</div>

<script>
let cart = [];
let total = 0;

let products = [
 {name:"Rice", price:60, cat:"grocery", img:"https://images.unsplash.com/photo-1586201375761-83865001e31c"},
 {name:"Flour", price:50, cat:"grocery", img:"https://images.unsplash.com/photo-1604908176997-4315f92f49b3"},
 {name:"Oil", price:120, cat:"grocery", img:"https://images.unsplash.com/photo-1585238342024-78d387f4a707"},
 {name:"Sugar", price:45, cat:"grocery", img:"https://images.unsplash.com/photo-1587731556938-38755b4803a6"},
 {name:"Toy Car", price:150, cat:"toys", img:"https://images.unsplash.com/photo-1596464716127-f2a82984de30"},
 {name:"Teddy", price:300, cat:"toys", img:"https://images.unsplash.com/photo-1583337130417-3346a1be7dee"}
];

function display(list){
 let html="";
 list.forEach(p=>{
  html += `
  <div class="card">
    <img src="${p.img}">
    <h4>${p.name}</h4>
    <p>₹${p.price}</p>
    <button onclick="add('${p.name}',${p.price})">Add</button>
  </div>`;
 });
 document.getElementById("products").innerHTML = html;
}

display(products);

function filter(cat){
 if(cat=="all") display(products);
 else display(products.filter(p=>p.cat==cat));
}

function add(name, price){
 cart.push(name);
 total += price;
 document.getElementById("count").innerText = cart.length;
 document.getElementById("total").innerText = total;
}

function payNow(){
 window.location.href="upi://pay?pa=9105012459@ybl&pn=OmStore&cu=INR&am="+total;
}

function whatsappOrder(){
 let phone="919105012459";
 let msg="Order: "+cart.join(", ")+" Total ₹"+total;
 window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
