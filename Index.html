<!DOCTYPE html>
<html>
<head>
<title>Om Provisional Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {margin:0;font-family:sans-serif;background:#f1f3f6;}

header {background:#2874f0;color:white;padding:12px;text-align:center;font-size:20px;}

.search {
 padding:10px;
 text-align:center;
}
.search input {
 width:90%;
 padding:10px;
 border-radius:5px;
 border:1px solid #ccc;
}

.products {
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:12px;
 padding:10px;
}

.card {
 background:white;
 padding:10px;
 border-radius:10px;
 text-align:center;
 box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img {
 width:100%;
 height:110px;
 object-fit:cover;
 border-radius:5px;
}

button {
 background:#ff9f00;
 color:white;
 border:none;
 padding:7px;
 width:100%;
 margin-top:5px;
 border-radius:5px;
}

#cart {
 position:fixed;
 bottom:0;
 width:100%;
 background:white;
 padding:10px;
 display:flex;
 justify-content:space-between;
 box-shadow:0 -2px 5px rgba(0,0,0,0.2);
}
</style>

</head>

<body>

<header>🛒 Om Provisional Store</header>

<div class="search">
<input type="text" id="search" placeholder="Search products..." onkeyup="searchProduct()">
</div>

<div id="products" class="products"></div>

<div id="cart">
<div>🛒 <span id="count">0</span> | ₹ <span id="total">0</span></div>
<div>
<button onclick="payNow()">Pay</button>
<button onclick="order()">Order</button>
</div>
</div>

<script>
let cart=[], total=0;

let products = [
{name:"Rice",price:60,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c"},
{name:"Flour",price:50,img:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec"},
{name:"Oil",price:120,img:"https://images.unsplash.com/photo-1615485737457-1c3ecb9e3f74"},
{name:"Sugar",price:45,img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924"},
{name:"Milk",price:30,img:"https://images.unsplash.com/photo-1625944230945-1b7dd3b949ab"},
{name:"Biscuits",price:20,img:"https://images.unsplash.com/photo-1604908177225-3b6f0cde2d2b"},
{name:"Tea",price:100,img:"https://images.unsplash.com/photo-1512568400610-62da28bc8a13"},
{name:"Salt",price:20,img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924"},
{name:"Soap",price:35,img:"https://images.unsplash.com/photo-1581578731548-c64695cc6952"},
{name:"Shampoo",price:120,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348"},
{name:"Toothpaste",price:90,img:"https://images.unsplash.com/photo-1588776814546-ec7e0a0b2d5a"},
{name:"Maggi",price:15,img:"https://images.unsplash.com/photo-1605478371310-a9f1e96b1b6d"},
{name:"Chocolate",price:50,img:"https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"},
{name:"Cold Drink",price:40,img:"https://images.unsplash.com/photo-1580910051074-3eb694886505"},
{name:"Toy Car",price:150,img:"https://images.unsplash.com/photo-1596464716127-f2a82984de30"},
{name:"Teddy Bear",price:300,img:"https://images.unsplash.com/photo-1583337130417-3346a1be7dee"},
{name:"Ball",price:80,img:"https://images.unsplash.com/photo-1575361204480-aadea25e6e68"},
{name:"Doll",price:200,img:"https://images.unsplash.com/photo-1601758125946-6ec2ef64daf8"}
];

function display(list){
 let html="";
 list.forEach(p=>{
  html += `
  <div class="card">
    <img src="${p.img}">
    <h4>${p.name}</h4>
    <p>₹${p.price}</p>
    <button onclick="add('${p.name}',${p.price})">Add</button>
  </div>`;
 });
 document.getElementById("products").innerHTML = html;
}

display(products);

function searchProduct(){
 let val=document.getElementById("search").value.toLowerCase();
 let filtered=products.filter(p=>p.name.toLowerCase().includes(val));
 display(filtered);
}

function add(n,p){
 cart.push(n);
 total+=p;
 document.getElementById("count").innerText=cart.length;
 document.getElementById("total").innerText=total;
}

function payNow(){
 window.location.href="upi://pay?pa=9105012459@ybl&pn=OmStore&am="+total+"&cu=INR";
}

function order(){
 window.open("https://wa.me/919105012459?text="+encodeURIComponent("Order: "+cart.join(", ")+" Total ₹"+total));
}
</script>

</body>
</html>
