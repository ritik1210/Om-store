<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Om Provisional Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary: #2874f0;
            --secondary: #ff9f00;
            --accent: #ff6a00;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #f1f3f6;
            padding-bottom: 100px;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-title { font-size: 24px; font-weight: bold; }

        /* CUSTOM ITEM SECTION */
        .custom-item-box {
            background: #fff;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            border: 2px dashed var(--secondary);
            text-align: center;
        }

        .custom-item-box input {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-custom {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* SEARCH BAR */
        .search-container {
            background: var(--primary);
            padding: 0 15px 15px 15px;
            position: sticky;
            top: 68px;
            z-index: 1000;
        }

        .search-container input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* PRODUCT GRID */
        .products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h4 { margin: 10px 0 5px; font-size: 15px; color: #333; height: 36px; overflow: hidden; }
        .card p { color: #26a541; font-weight: bold; margin: 5px 0; }

        .btn-add {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
        }

        /* CART PANEL */
        #cartBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10000;
        }

        #cartPanel {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 75%;
            background: white;
            border-radius: 20px 20px 0 0;
            z-index: 10001;
            transition: 0.4s;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        #cartPanel.active { bottom: 0; }
        
        .overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); display:none; z-index:10000;
        }
        .overlay.active { display:block; }

        .cart-list-container { flex-grow: 1; overflow-y: auto; }
        .cart-item-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<header>
    <div class="header-title">🛒 Om Provisional Store</div>
</header>

<div class="search-container">
    <input type="text" id="search" placeholder="Rice, Maggie, Chai khojiye..." onkeyup="searchProduct()">
</div>

<div class="custom-item-box">
    <h4 style="margin-top:0;">Kuch nahi mil raha? Yahan likhein:</h4>
    <input type="text" id="customName" placeholder="Samaan ka naam (e.g. 5kg Chini)">
    <button class="btn-custom" onclick="addCustom()">Cart mein Daalein</button>
</div>

<div id="products" class="products"></div>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<button id="cartBtn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>

<div id="cartPanel">
    <h2 style="margin-top:0;">Apka Order</h2>
    <div id="cartList" class="cart-list-container">
        <p style="color:gray; text-align:center;">Cart khali hai...</p>
    </div>
    <hr>
    <div style="font-size:20px; font-weight:bold; margin-bottom:15px; display:flex; justify-content:space-between;">
        <span>Total (Est.):</span>
        <span>₹<span id="total">0</span></span>
    </div>
    <button onclick="order()" style="background:#25D366; color:white; border:none; padding:15px; width:100%; border-radius:8px; font-weight:bold; font-size:16px; margin-bottom:10px;">WhatsApp Order Karein</button>
    <button onclick="closeCart()" style="background:none; border:none; color:#666; font-weight:bold; width:100%;">Peeche Jayein</button>
</div>

<script>
let cart = {};
let customItems = []; // Alag list custom items ke liye
let total = 0;

const products = [
    {id: 1, name: "Premium Rice (1kg)", price: 60, img: "https://images.pexels.com/photos/4110251/pexels-photo-4110251.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 2, name: "Wheat Flour (5kg)", price: 245, img: "https://images.pexels.com/photos/5908235/pexels-photo-5908235.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 3, name: "Sugar (1kg)", price: 45, img: "https://images.pexels.com/photos/5947055/pexels-photo-5947055.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 4, name: "Maggie (Masala)", price: 14, img: "https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?w=300&auto=format&fit=crop"},
    {id: 5, name: "Tedha Medha", price: 20, img: "https://images.unsplash.com/photo-1600326145359-3a44909d1a39?w=300&auto=format&fit=crop"},
    {id: 6, name: "Tata Chai (250g)", price: 110, img: "https://images.unsplash.com/photo-1594631252845-29fc458695d1?w=300&auto=format&fit=crop"},
    {id: 7, name: "Barumal Chai", price: 95, img: "https://images.unsplash.com/photo-1544787210-2211d64b565a?w=300&auto=format&fit=crop"},
    {id: 8, name: "Kuttu Aata (500g)", price: 80, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300&auto=format&fit=crop"},
    {id: 9, name: "Samak Chawal", price: 90, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300&auto=format&fit=crop"},
    {id: 10, name: "Bhooni Cholai", price: 40, img: "https://images.unsplash.com/photo-1511690656952-34342bb7c2f2?w=300&auto=format&fit=crop"},
    {id: 11, name: "Toor Dal (1kg)", price: 160, img: "https://images.pexels.com/photos/414645/pexels-photo-414645.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 12, name: "Lays Chips (Blue)", price: 20, img: "https://images.pexels.com/photos/5614134/pexels-photo-5614134.jpeg?auto=compress&cs=tinysrgb&w=300"}
];

function display(list) {
    let html = "";
    list.forEach(p => {
        html += `<div class="card"><img src="${p.img}"><h4>${p.name}</h4><p>₹${p.price}</p><button class="btn-add" onclick="addToCart(${p.id})">Add Item</button></div>`;
    });
    document.getElementById("products").innerHTML = html;
}
display(products);

function searchProduct() {
    let val = document.getElementById("search").value.toLowerCase();
    let filtered = products.filter(p => p.name.toLowerCase().includes(val));
    display(filtered);
}

// CUSTOM ITEM ADD KARNE KA FUNCTION
function addCustom() {
    let input = document.getElementById("customName");
    if(input.value.trim() === "") return alert("Pehle kuch likhein!");
    customItems.push(input.value);
    input.value = "";
    updateUI();
    alert("Item cart mein add ho gaya!");
}

function addToCart(pid) {
    let p = products.find(i => i.id === pid);
    if(cart[pid]) cart[pid].qty++;
    else cart[pid] = { name: p.name, price: p.price, qty: 1 };
    updateUI();
}

function updateUI() {
    let count = 0; total = 0;
    let listHTML = "";
    
    // Regular Items
    for(let id in cart) {
        count += cart[id].qty;
        total += (cart[id].price * cart[id].qty);
        listHTML += `<div class="cart-item-row"><span>${cart[id].name} (x${cart[id].qty})</span><span>₹${cart[id].price * cart[id].qty}</span></div>`;
    }
    
    // Custom Items
    customItems.forEach((item, index) => {
        count++;
        listHTML += `<div class="cart-item-row"><span style="color:blue;">📝 ${item}</span><span>(Manual)</span></div>`;
    });

    document.getElementById("count").innerText = count;
    document.getElementById("total").innerText = total;
    document.getElementById("cartList").innerHTML = listHTML || '<p style="color:gray; text-align:center;">Cart khali hai...</p>';
}

function openCart() { 
    document.getElementById("cartPanel").classList.add("active"); 
    document.getElementById("overlay").classList.add("active"); 
}
function closeCart() { 
    document.getElementById("cartPanel").classList.remove("active"); 
    document.getElementById("overlay").classList.remove("active"); 
}

function order() {
    if(Object.keys(cart).length === 0 && customItems.length === 0) return alert("Cart khali hai!");
    
    let name = prompt("Aapka Naam:");
    let phone = prompt("Mobile Number:");
    let address = prompt("Pura Pata (Address):");
    if (!name || !phone || !address) return alert("Details bharna zaroori hai!");

    let orderDetails = "🛒 *NAYA ORDER - Om Provisional Store*\n\n";
    orderDetails += `*Grahak:* ${name}\n*Phone:* ${phone}\n*Pata:* ${address}\n\n`;
    
    orderDetails += `*Items List:*\n`;
    for(let id in cart) {
        orderDetails += `• ${cart[id].name} (Qty: ${cart[id].qty}) - ₹${cart[id].price * cart[id].qty}\n`;
    }

    if(customItems.length > 0) {
        orderDetails += `\n*Alag se Maanga Samaan:*\n`;
        customItems.forEach(item => { orderDetails += `• ${item}\n`; });
    }
    
    orderDetails += `\n*TOTAL AMOUNT: ₹${total}* (+ Other Items Cost)`;
    window.open("https://wa.me/919105012459?text=" + encodeURIComponent(orderDetails));
}
</script>
</body>
</html>
