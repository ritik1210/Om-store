<!DOCTYPE html>
<html>
<head>
<title>Om Provisional Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {margin:0; font-family:sans-serif; background:#f1f3f6;}

header {
 background:#2874f0;
 color:white;
 padding:15px;
 text-align:center;
 font-size:20px;
 font-weight:bold;
}

.hero {
 background:url('https://images.unsplash.com/photo-1607082349566-187342175e2f');
 background-size:cover;
 color:white;
 padding:60px 20px;
 text-align:center;
}

.hero h2 {
 font-size:28px;
}

.products {
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;
 padding:15px;
}

.card {
 background:white;
 border-radius:10px;
 padding:10px;
 text-align:center;
 box-shadow:0 2px 8px rgba(0,0,0,0.1);
 transition:0.3s;
}

.card:hover {
 transform:scale(1.05);
}

.card img {
 width:100%;
 height:120px;
 object-fit:cover;
 border-radius:5px;
}

button {
 background:#ff9f00;
 color:white;
 border:none;
 padding:8px;
 width:100%;
 margin-top:5px;
 border-radius:5px;
}

#cart {
 position:fixed;
 bottom:0;
 width:100%;
 background:#fff;
 padding:10px;
 display:flex;
 justify-content:space-between;
 box-shadow:0 -2px 5px rgba(0,0,0,0.2);
}
</style>

</head>

<body>

<header>🛒 Om Provisional Store</header>

<div class="hero">
<h2>Best Grocery & Toys Store</h2>
<p>Fast Delivery | Best Prices</p>
</div>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1586201375761-83865001e31c">
<h4>Rice</h4>
<p>₹60</p>
<button onclick="add('Rice',60)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1604908176997-4315f92f49b3">
<h4>Flour</h4>
<p>₹50</p>
<button onclick="add('Flour',50)">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1585238342024-78d387f4a707">
<h4>Oil</h4>
<p>₹120</p>
<button onclick="add('Oil',120)">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30">
<h4>Toy Car</h4>
<p>₹150</p>
<button onclick="add('Toy Car',150)">Add</button>
</div>

</div>

<div id="cart">
<div>
🛒 <span id="count">0</span> items | ₹ <span id="total">0</span>
</div>
<div>
<button onclick="payNow()">Pay</button>
<button onclick="order()">Order</button>
</div>
</div>

<script>
let cart=[], total=0;

function add(n,p){
 cart.push(n);
 total+=p;
 document.getElementById("count").innerText=cart.length;
 document.getElementById("total").innerText=total;
}

function payNow(){
 window.location.href="upi://pay?pa=9105012459@ybl&pn=OmStore&am="+total+"&cu=INR";
}

function order(){
 window.open("https://wa.me/919105012459?text="+encodeURIComponent("Order: "+cart.join(", ")+" Total ₹"+total));
}
</script>

</body>
</html>
