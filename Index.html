<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Om Provisional Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary: #2874f0;
            --secondary: #ff9f00;
            --accent: #ff6a00;
            --bg: #f1f3f6;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: var(--bg);
            padding-bottom: 100px;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1001;
        }

        .search-container {
            background: var(--primary);
            padding: 0 15px 15px 15px;
            position: sticky;
            top: 65px;
            z-index: 1000;
        }

        .search-container input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        /* OM LOGO DESIGN */
        .product-logo-circle {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #fff 0%, #fff9f0 100%);
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--secondary);
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .logo-om { font-size: 32px; color: #ff6a00; font-weight: bold; }
        .logo-name { font-size: 8px; font-weight: bold; color: #333; }

        .products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn-add {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        /* PAYMENT INFO BOX */
        .payment-box {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4caf50;
            margin-bottom: 15px;
            text-align: center;
        }

        #cartBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10000;
        }

        #cartPanel {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 85%;
            background: white;
            border-radius: 25px 25px 0 0;
            z-index: 10001;
            transition: 0.4s;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        #cartPanel.active { bottom: 0; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:none; z-index:10000; }
        .overlay.active { display:block; }

        .cart-list { flex-grow: 1; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .btn-del { color: red; border: none; background: none; font-weight: bold; padding: 5px; }

    </style>
</head>
<body>

<header>
    <div style="font-size: 22px; font-weight: bold;">ॐ Om Provisional Store</div>
</header>

<div class="search-container">
    <input type="text" id="search" placeholder="Saman khojiye..." onkeyup="searchProduct()">
</div>

<div id="products" class="products"></div>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<button id="cartBtn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>

<div id="cartPanel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Apka Order</h2>
        <button onclick="closeCart()" style="font-size:30px; border:none; background:none; cursor:pointer;">&times;</button>
    </div>
    <hr>
    
    <div class="payment-box">
        <strong style="color:#2e7d32;">💰 UPI Payment Karein:</strong><br>
        <span style="font-size: 18px; font-weight: bold; color: #1565c0;">9105012459@ybl</span><br>
        <small>(Google Pay, PhonePe, Paytm Sab chalega)</small>
    </div>

    <div id="cartList" class="cart-list"></div>
    
    <div style="font-size:20px; font-weight:bold; margin: 15px 0; display:flex; justify-content:space-between;">
        <span>Total Amount:</span>
        <span>₹<span id="total">0</span></span>
    </div>

    <button onclick="order()" style="background:#25D366; color:white; border:none; padding:15px; width:100%; border-radius:10px; font-weight:bold; font-size:18px; cursor:pointer;">
        Order Karein aur Pay Karein
    </button>
</div>

<script>
let cart = {};
let total = 0;

const products = [
    {id: 1, name: "Premium Rice (1kg)", price: 60},
    {id: 2, name: "Wheat Flour (5kg)", price: 245},
    {id: 3, name: "Sugar (1kg)", price: 45},
    {id: 4, name: "Salt (Namak)", price: 20},
    {id: 5, name: "Maggie (Masala)", price: 14},
    {id: 6, name: "Tedha Medha", price: 20},
    {id: 7, name: "Tata Chai (250g)", price: 110},
    {id: 8, name: "Barumal Chai", price: 95},
    {id: 9, name: "Kuttu Aata (500g)", price: 80},
    {id: 10, name: "Samak Chawal", price: 90},
    {id: 11, name: "Toor Dal (1kg)", price: 160},
    {id: 12, name: "Bhooni Cholai", price: 40}
];

function display(list) {
    let html = "";
    list.forEach(p => {
        html += `
        <div class="card">
            <div class="product-logo-circle"><span class="logo-om">ॐ</span><span class="logo-name">OM STORE</span></div>
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>
            <button class="btn-add" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("products").innerHTML = html || '<p style="grid-column:1/-1; text-align:center;">Saman nahi mila!</p>';
}
display(products);

function searchProduct() {
    let val = document.getElementById("search").value.toLowerCase();
    display(products.filter(p => p.name.toLowerCase().includes(val)));
}

function addToCart(pid) {
    let p = products.find(i => i.id === pid);
    if(cart[pid]) cart[pid].qty++;
    else cart[pid] = { name: p.name, price: p.price, qty: 1 };
    updateUI();
}

function removeItem(pid) {
    delete cart[pid];
    updateUI();
}

function updateUI() {
    let count = 0; total = 0;
    let listHTML = "";
    for(let id in cart) {
        count += cart[id].qty;
        total += (cart[id].price * cart[id].qty);
        listHTML += `
            <div class="cart-item">
                <span>${cart[id].name} (x${cart[id].qty})</span>
                <span>₹${cart[id].price * cart[id].qty} <button class="btn-del" onclick="removeItem(${id})">✖</button></span>
            </div>`;
    }
    document.getElementById("count").innerText = count;
    document.getElementById("total").innerText = total;
    document.getElementById("cartList").innerHTML = listHTML || '<p style="text-align:center; color:gray; margin-top:20px;">Cart khali hai...</p>';
}

function openCart() { document.getElementById("cartPanel").classList.add("active"); document.getElementById("overlay").classList.add("active"); }
function closeCart() { document.getElementById("cartPanel").classList.remove("active"); document.getElementById("overlay").classList.remove("active"); }

function order() {
    if(total === 0) return alert("Pehle kuch saman add karein!");
    
    let name = prompt("Aapka Naam:");
    let address = prompt("Delivery ka Pata (Address):");
    if(!name || !address) return;

    let msg = `🛒 *NAYA ORDER - Om Store*\n\n*Grahak:* ${name}\n*Pata:* ${address}\n\n*Saman:*\n`;
    for(let id in cart) { msg += `• ${cart[id].name} (Qty: ${cart[id].qty}) - ₹${cart[id].price * cart[id].qty}\n`; }
    
    msg += `\n*TOTAL: ₹${total}*`;
    msg += `\n\n✅ *Payment Information:*\nMaine UPI (9105012459@ybl) par ₹${total} pay kar diye hain. Kripya screenshot check karein.`;

    alert("Bhaiya, WhatsApp par message bhejne ke baad Payment ka Screenshot zaroor bhej dena!");
    window.open("https://wa.me/919105012459?text=" + encodeURIComponent(msg));
}
</script>
</body>
</html>
