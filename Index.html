<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Om Provisional Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary: #2874f0;
            --secondary: #ff9f00;
            --accent: #ff6a00;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #f1f3f6;
            padding-bottom: 80px;
        }

        /* FIXED HEADER */
        header {
            background: var(--primary);
            color: white;
            padding: 20px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* SEARCH BAR */
        .search-container {
            background: var(--primary);
            padding: 0 15px 15px 15px;
            position: sticky;
            top: 68px;
            z-index: 1000;
        }

        .search-container input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* PRODUCT GRID */
        .products {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Mobile ke liye 2 columns */
            gap: 12px;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 130px; /* Thodi badi image */
            object-fit: cover;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .card h4 { margin: 10px 0 5px; font-size: 15px; color: #333; }
        .card p { color: #26a541; font-weight: bold; margin: 5px 0; }

        .btn-add {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        /* CART BUTTON */
        #cartBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10000;
        }

        /* PANEL */
        #cartPanel {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 70%;
            background: white;
            border-radius: 20px 20px 0 0;
            z-index: 10001;
            transition: 0.4s;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        #cartPanel.active { bottom: 0; }
        
        .overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); display:none; z-index:10000;
        }
        .overlay.active { display:block; }
    </style>
</head>
<body>

<header>
    <div class="header-title">🛒 Om Provisional Store</div>
</header>

<div class="search-container">
    <input type="text" id="search" placeholder="Rice, Dal, Soap khojiye..." onkeyup="searchProduct()">
</div>

<div id="products" class="products"></div>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<button id="cartBtn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>

<div id="cartPanel">
    <h3>Apka Cart</h3>
    <div id="cartList" style="flex-grow:1; overflow-y:auto;"></div>
    <hr>
    <div style="font-size:20px; font-weight:bold; margin-bottom:10px;">Total: ₹<span id="total">0</span></div>
    <button onclick="order()" style="background:#2874f0; color:white; border:none; padding:15px; width:100%; border-radius:5px; font-weight:bold; font-size:16px;">WhatsApp Order</button>
    <button onclick="closeCart()" style="background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Close</button>
</div>

<script>
let cart = {};
let total = 0;

// NEW STABLE IMAGE LINKS (Pexels)
const products = [
    {id: 1, name: "Premium Rice", price: 60, stock: true, img: "https://images.pexels.com/photos/4110251/pexels-photo-4110251.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 2, name: "Wheat Flour", price: 50, stock: true, img: "https://images.pexels.com/photos/5908235/pexels-photo-5908235.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 3, name: "Sugar", price: 45, stock: true, img: "https://images.pexels.com/photos/5947055/pexels-photo-5947055.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 4, name: "Salt", price: 20, stock: true, img: "https://images.pexels.com/photos/5465247/pexels-photo-5465247.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 5, name: "Dal", price: 120, stock: true, img: "https://images.pexels.com/photos/414645/pexels-photo-414645.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 6, name: "Lays Chips", price: 20, stock: true, img: "https://images.pexels.com/photos/5614134/pexels-photo-5614134.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 7, name: "Soap", price: 35, stock: true, img: "https://images.pexels.com/photos/6621325/pexels-photo-6621325.jpeg?auto=compress&cs=tinysrgb&w=300"},
    {id: 8, name: "Shampoo", price: 120, stock: true, img: "https://images.pexels.com/photos/4202325/pexels-photo-4202325.jpeg?auto=compress&cs=tinysrgb&w=300"}
];

function display(list) {
    let html = "";
    list.forEach(p => {
        html += `
        <div class="card">
            <img src="${p.img}" alt="${p.name}">
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>
            <button class="btn-add" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("products").innerHTML = html;
}
display(products);

function searchProduct() {
    let val = document.getElementById("search").value.toLowerCase();
    let filtered = products.filter(p => p.name.toLowerCase().includes(val));
    display(filtered);
}

function addToCart(pid) {
    let p = products.find(i => i.id === pid);
    if(cart[pid]) cart[pid].qty++;
    else cart[pid] = {...p, qty: 1};
    updateUI();
}

function updateUI() {
    let count = 0; total = 0;
    let listHTML = "";
    for(let id in cart) {
        count += cart[id].qty;
        total += cart[id].price * cart[id].qty;
        listHTML += `<p>${cart[id].name} x ${cart[id].qty} = ₹${cart[id].price * cart[id].qty}</p>`;
    }
    document.getElementById("count").innerText = count;
    document.getElementById("total").innerText = total;
    document.getElementById("cartList").innerHTML = listHTML || "Cart Khali Hai";
}

function openCart() { 
    document.getElementById("cartPanel").classList.add("active"); 
    document.getElementById("overlay").classList.add("active"); 
}
function closeCart() { 
    document.getElementById("cartPanel").classList.remove("active"); 
    document.getElementById("overlay").classList.remove("active"); 
}

function order() {
    if(total === 0) return alert("Pehle items add karein!");
    let details = "🛒 *Naya Order - Om Provisional Store*\n\n";
    for(let id in cart) {
        details += `• ${cart[id].name} (${cart[id].qty} Qty)\n`;
    }
    details += `\n*Total: ₹${total}*`;
    window.open("https://wa.me/919105012459?text=" + encodeURIComponent(details));
}
</script>
</body>
</html>
